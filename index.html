<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Makes and Models</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .make-container {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            background-color: #f9f9f9;
        }
        .make-name {
            font-size: 24px;
            font-weight: bold;
            color: #0066cc;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }
        .models-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .model-item {
            background-color: #e6f2ff;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
        .error {
            color: #cc0000;
            font-weight: bold;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .retry-btn {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .retry-btn:hover {
            background-color: #0055aa;
        }
    </style>
</head>
<body>
    <h1>Car Makes and Models</h1>
    <div id="makes-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const makesContainer = document.getElementById('makes-container');
            
            // Function to fetch with CORS proxy
            function fetchWithProxy(url) {
                // Using a public CORS proxy
                const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
                return fetch(proxyUrl + url, {
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
            }
            
            function loadData() {
                // Show loading spinner
                makesContainer.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading car makes...</p>
                    </div>
                `;
                
                // First fetch all makes
                fetchWithProxy('https://services.mobile.de/refdata/classes/Car/makes')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(makes => {
                        makesContainer.innerHTML = '';
                        
                        // For each make, fetch its models
                        makes.forEach(make => {
                            const makeDiv = document.createElement('div');
                            makeDiv.className = 'make-container';
                            makeDiv.innerHTML = `
                                <div class="make-name">${make.name}</div>
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <p>Loading models...</p>
                                </div>
                                <div class="models-list" id="models-${make.id}"></div>
                            `;
                            makesContainer.appendChild(makeDiv);
                            
                            // Fetch models for this make
                            fetchWithProxy(`https://services.mobile.de/refdata/classes/Car/makes/${make.id}/models`)
                                .then(response => {
                                    if (!response.ok) {
                                        throw new Error(`Failed to fetch models for ${make.name}`);
                                    }
                                    return response.json();
                                })
                                .then(models => {
                                    const modelsList = document.getElementById(`models-${make.id}`);
                                    modelsList.previousElementSibling.remove(); // Remove loading spinner
                                    
                                    if (models.length === 0) {
                                        modelsList.innerHTML = '<div>No models found</div>';
                                        return;
                                    }
                                    
                                    models.forEach(model => {
                                        const modelItem = document.createElement('div');
                                        modelItem.className = 'model-item';
                                        modelItem.textContent = model.name;
                                        modelsList.appendChild(modelItem);
                                    });
                                })
                                .catch(error => {
                                    const modelsList = document.getElementById(`models-${make.id}`);
                                    modelsList.previousElementSibling.remove(); // Remove loading spinner
                                    modelsList.innerHTML = `
                                        <div class="error">Error loading models: ${error.message}</div>
                                        <button class="retry-btn" onclick="retryModelFetch('${make.id}', '${make.name}')">Retry</button>
                                    `;
                                });
                        });
                    })
                    .catch(error => {
                        makesContainer.innerHTML = `
                            <div class="error">
                                <p>Error loading car makes: ${error.message}</p>
                                <p>This might be due to CORS restrictions. Try:</p>
                                <ul>
                                    <li>Using a browser extension to disable CORS</li>
                                    <li>Running this page through a local server</li>
                                </ul>
                                <button class="retry-btn" onclick="loadData()">Retry</button>
                            </div>
                        `;
                    });
            }
            
            // Global function for retrying model fetch
            window.retryModelFetch = function(makeId, makeName) {
                const modelsList = document.getElementById(`models-${makeId}`);
                modelsList.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading models...</p>
                    </div>
                `;
                
                fetchWithProxy(`https://services.mobile.de/refdata/classes/Car/makes/${makeId}/models`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Failed to fetch models for ${makeName}`);
                        }
                        return response.json();
                    })
                    .then(models => {
                        modelsList.innerHTML = '';
                        
                        if (models.length === 0) {
                            modelsList.innerHTML = '<div>No models found</div>';
                            return;
                        }
                        
                        models.forEach(model => {
                            const modelItem = document.createElement('div');
                            modelItem.className = 'model-item';
                            modelItem.textContent = model.name;
                            modelsList.appendChild(modelItem);
                        });
                    })
                    .catch(error => {
                        modelsList.innerHTML = `
                            <div class="error">Error loading models: ${error.message}</div>
                            <button class="retry-btn" onclick="retryModelFetch('${makeId}', '${makeName}')">Retry</button>
                        `;
                    });
            };
            
            // Initial load
            loadData();
        });
    </script>
</body>
</html>
