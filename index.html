<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Car Models XMLs</title>
</head>
<body>
  <h1>Car Models Data</h1>
  <div id="xml-container"></div>

  <script>
    const urls = [
      "https://services.mobile.de/refdata/classes/Car/makes/ABARTH/models",
      "https://services.mobile.de/refdata/classes/Car/makes/AC/models",
      "https://services.mobile.de/refdata/classes/Car/makes/ACURA/models",
      "https://services.mobile.de/refdata/classes/Car/makes/AIWAYS/models",
      "https://services.mobile.de/refdata/classes/Car/makes/AIXAM/models",
      "https://services.mobile.de/refdata/classes/Car/makes/ALFA ROMEO/models",
      "https://services.mobile.de/refdata/classes/Car/makes/ALPINA/models",
      "https://services.mobile.de/refdata/classes/Car/makes/ALPINE/models",
      "https://services.mobile.de/refdata/classes/Car/makes/ALVIS/models",
      "https://services.mobile.de/refdata/classes/Car/makes/ARIEL/models",
      "https://services.mobile.de/refdata/classes/Car/makes/ARTEGA/models",
      
    ];

    const container = document.getElementById('xml-container');

    async function fetchAndDisplayXML(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        const text = await response.text();
        const pre = document.createElement('pre');
        pre.textContent = text;
        container.appendChild(pre);
      } catch (error) {
        console.error('Error fetching:', url, error);
      }
    }

    urls.forEach(url => {
      fetchAndDisplayXML(url);
    });
  </script>
</body>
</html>
